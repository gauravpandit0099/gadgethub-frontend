
<header class="sticky top-0 z-30 flex h-[68px] items-center justify-between gap-4 border-b border-white/[0.07] bg-[#090d19]/90 px-4 backdrop-blur-xl sm:px-6 lg:px-8">
  <div class="flex min-w-0 flex-1 items-center gap-3">
    <div class="relative w-full max-w-md">
      <svg class="pointer-events-none absolute left-3.5 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="11" cy="11" r="7"/><path d="m16 16 4 4"/>
      </svg>
      <input
        type="search"
        placeholder="Search orders, customers, products..."
        (input)="onSearch($event)"
        class="w-full rounded-xl border border-white/[0.08] bg-white/[0.03] py-2.5 pl-10 pr-4 text-xs text-white outline-none transition placeholder:text-slate-500 focus:border-violet-400/50 focus:bg-white/[0.05] focus:ring-2 focus:ring-violet-500/10"
      />
    </div>
  </div>

  <div class="flex shrink-0 items-center gap-3 sm:gap-5">
    <div class="hidden items-center gap-2 rounded-full border border-white/[0.08] bg-white/[0.03] px-3 py-2 sm:flex">
      <span class="h-2 w-2 rounded-full bg-emerald-400 shadow-[0_0_8px_#34d399]"></span>
      <span class="text-[10px] font-semibold text-slate-300">Store operational</span>
    </div>

    <div class="flex h-9 w-9 items-center justify-center rounded-xl border border-white/[0.08] bg-white/[0.03] text-slate-400">
      <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>
      </svg>
    </div>

    <div class="hidden items-center gap-3 sm:flex">
      <div class="flex h-9 w-9 items-center justify-center rounded-full bg-gradient-to-br from-fuchsia-500 to-violet-600 text-[10px] font-bold text-white shadow-lg shadow-violet-500/20">
        GA
      </div>
      <div>
        <p class="text-xs font-semibold text-white">GadgetHub Admin</p>
        <p class="mt-1 text-[10px] text-slate-500">Administrator</p>
      </div>
    </div>
  </div>
</header>
